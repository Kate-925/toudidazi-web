    :root {

      --shadow: 0 2px 10px rgba(30, 41, 59, 0.04);

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Nav */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(246, 245, 240, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.3px;
      cursor: pointer;
    }
    .brand-badge {
      height: 32px;
      padding: 0 10px;
      border-radius: 9px;
      background: var(--primary);
      color: #FEF08A;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.2px;
    }
    .brand-tag {
      font-size: 11px;
      font-weight: 600;
      background: var(--highlight);
      color: var(--text);
      padding: 2px 7px;
      border-radius: 999px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .nav-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      padding: 8px 13px;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .nav-btn:hover { background: rgba(30, 41, 59, 0.06); color: var(--text); }
    .nav-btn.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.06); }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pill-btn {
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .pill-btn:hover { border-color: var(--primary); }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #94A3B8;
      display: inline-block;
    }
    .dot.ok { background: #10B981; }
    .dot.warn { background: #F59E0B; }

    .container {
